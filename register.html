[8:17 pm, 14/10/2026] Tshering Deki: <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JNEC Events Hub - Register</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header -->
    <header id="top">
        <h1>JNEC Events Hub</h1>

        <nav id="mainNav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html" aria-current="page">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <div class="container py-4">

            <h2 class="mb-4">Event Registration</h2>

            <form
                action="#"
                method="post"
                enctype="multipart/form-data"
                id="regForm"
                novalidate
            >

                <!-- Personal Details -->
                <fieldset class="mb-4">
                    <legend>Personal Details</legend>

                    <div class="mb-3">
                        <label for="fullname" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="fullname"
                            name="fullname"
                            required
                        >

                        <span
                            id="fullnameError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >

                        <span
                            id="emailError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            Phone
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="phone"
                            name="phone"
                            required
                        >

                        <span
                            id="phoneError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>
                </fieldset>

                <!-- Event Choice -->
                <fieldset class="mb-4">
                    <legend>Event Choice</legend>

                    <div class="mb-3">
                        <label for="event_id" class="form-label">
                            Event
                        </label>

                        <select
                            class="form-select"
                            id="event_id"
                            name="event_id"
                            required
                        >
                            <option value="">-- choose an event --</option>
                            <option value="1">Tech Week Hackathon</option>
                            <option value="2">Losar Festival Night</option>
                            <option value="3">Inter-College Football</option>
                        </select>

                        <span
                            id="eventError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>

                    <!-- Food Preference -->
                    <p>Food preference:</p>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="radio"
                            id="veg"
                            name="food"
                            value="veg"
                        >

                        <label class="form-check-label" for="veg">
                            Vegetarian
                        </label>
                    </div>

                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="radio"
                            id="nonveg"
                            name="food"
                            value="nonveg"
                        >

                        <label class="form-check-label" for="nonveg">
                            Non-vegetarian
                        </label>
                    </div>

                    <span
                        id="foodError"
                        class="error-message text-danger"
                        aria-live="polite"
                    ></span>

                    <!-- Interests -->
                    <p class="mt-3">Interested in:</p>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="volunteer"
                            name="interests"
                            value="volunteer"
                        >

                        <label class="form-check-label" for="volunteer">
                            Volunteering
                        </label>
                    </div>

                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="perform"
                            name="interests"
                            value="perform"
                        >

                        <label class="form-check-label" for="perform">
                            Performing
                        </label>
                    </div>
                </fieldset>

                <!-- Other Details -->
                <fieldset class="mb-4">
                    <legend>Other Details</legend>

                    <div class="mb-3">
                        <label for="department" class="form-label">
                            Department
                        </label>

                        <select
                            class="form-select"
                            id="department"
                            name="department"
                            required
                        >
                            <option value="">-- choose department --</option>
                            <option value="it">Information Technology</option>
                            <option value="civil">Civil</option>
                            <option value="electrical">Electrical</option>
                        </select>

                        <span
                            id="departmentError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>

                    <!-- Remarks -->
                    <div class="mb-3">
                        <label for="remarks" class="form-label">
                            Remarks
                        </label>

                        <textarea
                            class="form-control"
                            id="remarks"
                            name="remarks"
                            rows="4"
                        ></textarea>
                    </div>

                    <!-- Student ID Card -->
                    <div class="mb-3">
                        <label for="id_card" class="form-label">
                            Student ID Card (Image)
                        </label>

                        <input
                            class="form-control"
                            type="file"
                            id="id_card"
                            name="id_card"
                            accept="image/*"
                        >

                        <span
                            id="idCardError"
                            class="error-message text-danger"
                            aria-live="polite"
                        ></span>
                    </div>
                </fieldset>

                <!-- Buttons -->
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-paper-plane"></i>
                    Register
                </button>

                <button type="reset" class="btn btn-outline-secondary">
                    Clear
                </button>

                <!-- Form Status Message -->
                <p
                    id="formMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer id="pageFooter" class="mt-4">
        <p>&copy; <span id="year"></span> JNEC Events Hub</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JavaScript: load once -->
    <script src="js/main.js"></script>

    <!-- Registration Validation JavaScript -->
    <script src="js/register.js"></script>

</body>
</html>
