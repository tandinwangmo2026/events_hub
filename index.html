<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JNEC Events Hub - Home</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Carousel Image Styling -->
    <style>
        .carousel-item img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header id="top">
        <h1>JNEC Events Hub</h1>

        <!-- Dark Mode Button -->
        <button
            type="button"
            id="darkToggle"
            class="btn btn-dark m-2"
            aria-pressed="false"
        >
            <i class="fa-solid fa-moon"></i> Dark Mode
        </button>

        <!-- Navigation -->
        <nav id="mainNav" aria-label="Main navigation">
            <a href="index.html" aria-current="page" title="Go to home page">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <div class="container py-4">

            <!-- Event Image Carousel -->
            <div
                id="eventCarousel"
                class="carousel slide mb-4"
                data-bs-ride="carousel"
            >
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img
                            src="media/hackathon.jpg"
                            class="d-block w-100"
                            alt="JNEC hackathon event"
                        >
                    </div>

                    <div class="carousel-item">
                        <img
                            src="media/Jnec.jpg"
                            class="d-block w-100"
                            alt="JNEC campus"
                        >
                    </div>

                </div>

                <!-- Previous Button -->
                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#eventCarousel"
                    data-bs-slide="prev"
                    aria-label="Previous slide"
                >
                    <span
                        class="carousel-control-prev-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Previous</span>
                </button>

                <!-- Next Button -->
                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#eventCarousel"
                    data-bs-slide="next"
                    aria-label="Next slide"
                >
                    <span
                        class="carousel-control-next-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- Welcome Section -->
            <section id="welcome" class="intro">
                <h2>Welcome</h2>

                <p id="welcomeMsg">
                    Welcome to JNEC Events Hub!
                </p>

                <p>
                    The <strong>Events Hub</strong> lists upcoming events at
                    <em>Jigme Namgyel Engineering College</em>.

                    <span
                        id="registrationNotice"
                        class="highlight"
                        title="Registrations close 3 days before each event"
                    >
                        Register early!
                    </span>
                </p>

                <img
                    id="campusImage"
                    src="media/losar.jpg"
                    alt="JNEC campus"
                    width="400"
                    title="Our campus in Dewathang"
                    class="img-fluid rounded"
                >
            </section>

            <!-- Upcoming Events Preview -->
            <section id="homeUpcomingEvents" class="mt-5">
                <h2 class="mb-3">Upcoming Events</h2>

                <!-- JavaScript displays event preview cards here -->
                <div class="row g-3" id="home-events"></div>

                <p class="mt-3">
                    <a href="events.html" class="btn btn-primary">
                        View All Events
                    </a>
                </p>
            </section>

            <!-- Campus Location -->
            <section id="location" class="mt-5">
                <h2>Find Us</h2>

                <iframe
                    id="campusMap"
                    src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88"
                    width="400"
                    height="250"
                    title="JNEC campus map"
                    loading="lazy"
                    class="img-fluid"
                ></iframe>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer id="pageFooter" class="mt-4">
        <p>
            &copy; <span id="year"></span> JNEC Events Hub
        </p>
    </footer>

    <!-- Bootstrap JavaScript: include once -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript: include once -->
    <script src="js/main.js"></script>

</body>
</html>
